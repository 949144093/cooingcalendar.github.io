<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽奖系统</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎉 晚风浮影专用抽奖系统</h1>
        </header>

        <!-- 抽奖类型子页面切换 -->
        <div class="mode-switch">
            <button id="modeMonthlyBtn" class="mode-btn active">抽月卡</button>
            <button id="modeBattleBtn" class="mode-btn">抽战令</button>
        </div>
        <div class="mode-desc" id="modeDesc">
            当前模式：抽月卡（出勤次数 ≥ 7 次可参与）
        </div>

        <div class="main-content">
            <!-- 左侧：数据管理区 -->
            <div class="left-panel">
                <div class="panel-section">
                    <h2>📊 数据管理</h2>
                    
                    <div class="upload-section">
                        <div class="upload-buttons">
                            <label for="excelFile" class="upload-btn">
                                <span>📁 导入Excel文件</span>
                                <input type="file" id="excelFile" accept=".xlsx,.xls" hidden>
                            </label>
                            <button id="downloadTemplateBtn" class="download-btn">📥 下载模板文件</button>
                        </div>
                        <div class="file-info" id="fileInfo"></div>
                        <div class="format-hint">
                            <strong>格式说明：</strong>Excel文件需包含"姓名"和"出勤次数"两列，出勤次数范围0-8；抽月卡：出勤 ≥ 7 次可参与；抽战令：满勤 8 次可参与
                        </div>
                    </div>

                    <div class="filter-section">
                        <label>
                            <input type="checkbox" id="showAll" checked>
                            显示所有人员（取消勾选仅显示可抽奖人员）
                        </label>
                    </div>

                    <div class="table-container">
                        <table id="nameTable">
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>姓名</th>
                                    <th>出勤次数</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr class="empty-row">
                                    <td colspan="5" class="empty-message">请导入Excel文件</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="stats-section">
                        <div class="stat-item">
                            <span class="stat-label">总人数：</span>
                            <span class="stat-value" id="totalCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">可抽奖：</span>
                            <span class="stat-value" id="eligibleCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">已抽取：</span>
                            <span class="stat-value" id="drawnCount">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：抽奖区 -->
            <div class="right-panel">
                <div class="panel-section">
                    <h2>🎲 抽奖区域</h2>
                    
                    <div class="lottery-controls">
                        <div class="input-group">
                            <label>抽取人数：</label>
                            <input type="number" id="drawCount" min="1" value="1" placeholder="自动计算">
                            <span class="hint">（5:1比例，可手动调整）</span>
                        </div>
                        <button id="drawBtn" class="draw-btn" disabled>开始抽奖</button>
                        <button id="resetBtn" class="reset-btn">重置抽奖</button>
                    </div>

                    <div class="lottery-display" id="lotteryDisplay">
                        <!-- 全屏名字滚动效果，不再使用转盘 -->
                        <div class="name-roller">
                            <div class="name-roller-subtitle">
                                当前可抽奖人数：<span id="rollerCount">0</span> 人
                            </div>
                            <div class="name-roller-box">
                                <div class="name-roller-label">本轮幸运嘉宾</div>
                                <div class="name-roller-main" id="wheelText">等待抽奖</div>
                            </div>
                            <div class="name-roller-tip">
                                点击「开始抽奖」后，将在所有可抽奖人员中随机滚动姓名，最终停留即为中奖人
                            </div>
                        </div>
                    </div>

                    <div class="results-section">
                        <h3 id="resultsTitle">🎊 月卡中奖名单</h3>
                        <div class="results-list" id="resultsList">
                            <div class="empty-results">暂无中奖记录</div>
                        </div>
                        <div class="results-actions">
                            <button id="copyResultsBtn" class="copy-btn" style="display: none;">复制中奖结果</button>
                            <button id="clearResultsBtn" class="clear-btn" style="display: none;">清空中奖记录</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>编辑人员信息</h2>
            <div class="modal-form">
                <div class="form-group">
                    <label>姓名：</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>出勤次数：</label>
                    <input type="number" id="editAttendance" min="0" max="8" required>
                </div>
                <div class="form-actions">
                    <button id="saveEditBtn" class="save-btn">保存</button>
                    <button id="cancelEditBtn" class="cancel-btn">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
