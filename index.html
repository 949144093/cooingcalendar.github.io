<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闻枫是傻杯</title>
    <style>
        body {
            /* 使用本地图片并设置为平铺 */
            background-image: url('wenfeng.png');
            background-repeat: repeat;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            position: relative; /* 为绝对定位的箭头提供容器 */
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .flashing-text {
            font-size: 10vw;
            color: white;
            font-weight: bold;
            text-shadow: 
                0 0 10px #fff, 
                0 0 20px #fff, 
                0 0 30px #ff00de, 
                0 0 40px #ff00de, 
                0 0 50px #ff00de, 
                0 0 60px #ff00de, 
                0 0 70px #ff00de;
            animation: flash 2s infinite ease-in-out;
        }

        @keyframes flash {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(1.05);
            }
        }

        .surprise-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 15px;
            z-index: 20;
        }

        #playButton {
            font-size: 24px;
            padding: 15px 30px;
            cursor: pointer;
            border: 3px solid #ff00de;
            background-color: #fff;
            color: #ff00de;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
            animation: pulse-button 1.5s infinite;
        }

        #playButton:hover {
            background-color: #ff00de;
            color: #fff;
        }

        .arrow {
            font-size: 40px;
            color: yellow;
            position: absolute;
            animation: blink-arrow 1s infinite;
        }

        @keyframes blink-arrow {
            50% { opacity: 0; }
        }
        
        @keyframes pulse-button {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 20, 147, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 20, 147, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 20, 147, 0); }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1 class="flashing-text">闻枫是傻杯</h1>
    </div>

    <div class="surprise-container" id="surprise">
        <button id="playButton">点击这里有惊喜</button>
        <!-- 自动生成箭头 -->
        <script>
            const surpriseBox = document.getElementById('surprise');
            const button = document.getElementById('playButton');
            const arrowCount = 20;
            for (let i = 0; i < arrowCount; i++) {
                const arrow = document.createElement('div');
                arrow.classList.add('arrow');
                arrow.innerHTML = ['&rarr;', '&darr;', '&larr;', '&uarr;', '&searr;', '&swarr;', '&nearr;', '&nwarr;'][Math.floor(Math.random() * 8)];
                
                // 在按钮周围随机分布
                const angle = Math.random() * Math.PI * 2;
                const radius = 120 + Math.random() * 80;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;

                arrow.style.left = `calc(50% + ${x}px)`;
                arrow.style.top = `calc(50% + ${y}px)`;
                arrow.style.transform = `translate(-50%, -50%) rotate(${angle + Math.PI}rad)`; // 指向中心
                arrow.style.animationDelay = `${Math.random()}s`;

                surpriseBox.appendChild(arrow);
            }
        </script>
    </div>

    <script>
        document.getElementById('playButton').addEventListener('click', function() {
            // 隐藏惊喜容器
            document.getElementById('surprise').style.display = 'none';

            const textToSpeak = '闻枫是傻杯';
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;

            function speak() {
                window.speechSynthesis.speak(utterance);
            }

            utterance.onend = function() {
                // 使用一个小的随机延迟来避免过于机械的循环
                setTimeout(speak, Math.random() * 500 + 200);
            };

            speak(); // 第一次播放
        });
    </script>
</body>
</html>
